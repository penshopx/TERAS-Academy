name: Browser idempotency

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-idempotency-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-idempotency-guard:
    name: Browser idempotency database guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify database safety guard
        run: pnpm --filter @workspace/api-server run test:browser-idempotency-guard

      - name: Verify browser job requires database guard
        run: pnpm --filter @workspace/api-server run test:browser-idempotency-workflow-contract

  browser-idempotency:
    name: Browser idempotency
    needs: browser-idempotency-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # This job owns this PostgreSQL service and the harness creates and drops
      # a uniquely named database inside it. Never fall back to an app database.
      INTEGRATION_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_URL: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm run setup:browser-idempotency

      - name: Verify retry idempotency
        run: pnpm run test:browser-idempotency
