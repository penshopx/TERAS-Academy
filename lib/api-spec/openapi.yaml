    /assistant/knowledge/search:
      post:
        operationId: searchAssistantKnowledge
        tags: [assistant]
        summary: Search published category-scoped assistant knowledge
        requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeSearchInput" } } } }
        responses:
          "200": { description: Citation-backed answer, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeSearchResult" } } } }
          "400": { $ref: "#/components/responses/BadRequest" }
    /admin/knowledge:
      get:
        operationId: listAdminKnowledgeArticles
        tags: [admin]
        responses: { "200": { description: All knowledge articles, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KnowledgeArticle" } } } } } }
      post:
        operationId: createAdminKnowledgeArticle
        tags: [admin]
        requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeArticleInput" } } } }
        responses: { "201": { description: Draft created, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeArticle" } } } }, "400": { $ref: "#/components/responses/BadRequest" } }
    /admin/knowledge/{articleId}:
      patch:
        operationId: updateAdminKnowledgeArticle
        tags: [admin]
        parameters: [{ name: articleId, in: path, required: true, schema: { type: string, minLength: 1 } }]
        requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeArticleUpdate" } } } }
        responses: { "200": { description: Article updated, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeArticle" } } } }, "404": { $ref: "#/components/responses/NotFound" } }
    /admin/knowledge/{articleId}/publish:
      post:
        operationId: publishAdminKnowledgeArticle
        tags: [admin]
        parameters: [{ name: articleId, in: path, required: true, schema: { type: string, minLength: 1 } }]
        responses: { "200": { description: Article published, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeArticle" } } } }, "404": { $ref: "#/components/responses/NotFound" } }
    LegacyCompactLearningTransitionRejection:
      type: object
      properties:
        status: { type: string, enum: [REJECTED] }
        reason:
          $ref: "#/components/schemas/LearningTransitionReason"
        message: { type: string }
        currentState:
          $ref: "#/components/schemas/LearningState"
      required: [status, reason, message, currentState]
components:
  parameters:
    PersonId: { name: personId, in: path, required: true, schema: { type: string } }
    PathwayId: { name: pathwayId, in: path, required: true, schema: { type: string } }
    CohortId: { name: cohortId, in: path, required: true, schema: { type: string } }
    EnrollmentId: { name: enrollmentId, in: path, required: true, schema: { type: string } }
    CourseId: { name: courseId, in: path, required: true, schema: { type: string } }
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: string
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        type: string
    RemediationId:
      name: remediationId
      in: path
      required: true
      schema:
        type: string
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        type: string
    PracticeAttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
  responses:
    Conflict:
      description: A lifecycle or uniqueness conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated user cannot perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    LearningState:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, LEARNING_COMPLETED, OUTCOME_VERIFIED, PRACTICE_REQUIRED, PRACTICE_IN_PROGRESS, EVIDENCE_SUBMITTED, UNDER_REVIEW, REVISION_REQUIRED, REMEDIATION, REASSESSMENT, READY, NOT_READY]
    CourseAuthoringEntity:
      type: string
      enum: [COURSE, COURSE_MODULE, LESSON, ACTIVITY, OUTCOME, RESOURCE]
    ManagedResourceUploadRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 180, pattern: "^[^/\\\\]+$" }
        size: { type: integer, minimum: 1, maximum: 104857600 }
        contentType:
