openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TERAS Academy capability development API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: session
    description: Authenticated TERAS identity and role context
  - name: learner
    description: Learner journey and capability records
  - name: trainer
    description: Trainer workspace
  - name: assessor
    description: Assessor workspace
  - name: programs
    description: Capability programs and curriculum
  - name: learning
    description: LMS learning-layer contracts and centralized transitions
  - name: admin
    description: Authorized operational administration; Clerk remains the identity boundary
  - name: storage
    description: Clerk-protected managed learning resource uploads and serving
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /session:
    get:
      operationId: getCurrentSession
      tags: [session]
      summary: Get the current authenticated TERAS session
      description: Returns active local roles derived server-side from the authenticated Clerk identity.
      responses:
        "200":
          description: Current TERAS session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: List capability programs
      responses:
        "200":
          description: Program catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramSummary"
  /programs/{programId}:
    get:
      operationId: getProgram
      tags: [programs]
      summary: Get a capability program
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: Program detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /learner/dashboard:
    get:
      operationId: getLearnerDashboard
      tags: [learner]
      summary: Get the learner dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerDashboard"
  /learner/pathway:
    post:
      operationId: selectLearnerPathway
      tags: [learner]
      summary: Select a capability pathway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathwaySelectionInput"
      responses:
        "201":
          description: Pathway selection recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathwaySelectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Transition rejected because the actor, learner, program, or pathway is not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningTransitionRejection"
        "404":
          description: Transition rejected because the learning activity does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningTransitionRejection"
  /learner/journey:
    get:
      operationId: getLearnerJourney
      tags: [learner]
      summary: Get the learner capability journey
      responses:
        "200":
          description: Journey timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JourneyStep"
  /learner/learning-plan:
    get:
      operationId: getLearnerLearningPlan
      tags: [learner]
      summary: Get the individual learning plan
      responses:
        "200":
          description: Individual learning plan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningPlanItem"
  /modules/{moduleId}:
    get:
      operationId: getModule
      tags: [learner, programs]
      summary: Get module learning and practice detail
      parameters:
        - $ref: "#/components/parameters/ModuleId"
      responses:
        "200":
          description: Module detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /practice/tasks:
    get:
      operationId: listPracticeTasks
      tags: [learner, trainer]
      summary: List practice tasks
      responses:
        "200":
          description: Practice task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PracticeTask"
  /practice/tasks/{taskId}/attempts:
    post:
      operationId: createPracticeAttempt
      tags: [learner]
      summary: Submit a practice attempt
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeAttemptInput"
      responses:
        "201":
          description: Practice attempt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeAttempt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /evidence:
    get:
      operationId: listEvidence
      tags: [learner, assessor]
      summary: List learner evidence
      responses:
        "200":
          description: Evidence records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvidenceRecord"
    post:
      operationId: createEvidence
      tags: [learner]
      summary: Submit an evidence record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceInput"
      responses:
        "201":
          description: Evidence submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /assessments:
    get:
      operationId: listAssessments
      tags: [learner]
      summary: List learner assessments
      responses:
        "200":
          description: Assessment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentSummary"
  /assessments/{assessmentId}:
    get:
      operationId: getAssessment
      tags: [learner, assessor]
      summary: Get assessment criteria and results
      parameters:
        - $ref: "#/components/parameters/AssessmentId"
        - name: learnerId
          in: query
          required: false
          description: Required for assessor access to an assigned learner; learners may omit it and can only view their own record.
          schema: { type: string }
      responses:
        "200":
          description: Assessment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /gaps:
    get:
      operationId: listGaps
      tags: [learner, trainer, assessor]
      summary: List learner capability gaps
      responses:
        "200":
          description: Gap list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Gap"
  /remediation:
    get:
      operationId: listRemediation
      tags: [learner, trainer, assessor]
      summary: List remediation plans
      responses:
        "200":
          description: Remediation plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemediationPlan"
  /remediation/{remediationId}/complete:
    post:
      operationId: completeRemediation
      tags: [learner]
      summary: Mark a remediation activity complete
      parameters:
        - $ref: "#/components/parameters/RemediationId"
      responses:
        "200":
          description: Updated remediation plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Required remediation activities and evidence prerequisites are not complete
          content:
            application/json:
              schema:
                type: object
                required: [error, message]
                properties:
                  error:
                    type: string
                    enum: [REMEDIATION_PREREQUISITES_NOT_MET]
                  message:
                    type: string
  /remediation/{remediationId}/activities/{activityId}/complete:
    post:
      operationId: completeRemediationActivity
      tags: [learner]
      summary: Append learner completion of one remediation activity
      parameters:
        - $ref: "#/components/parameters/RemediationId"
        - name: activityId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemediationActivityCompletionInput"
      responses:
        "201":
          description: Completion event appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationPlan"
        "200":
          description: Updated remediation plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationPlan"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Idempotency key reused with a different activity payload }
  /readiness:
    get:
      operationId: getLearnerReadiness
      tags: [learner, assessor]
      summary: Get learner readiness and gate progress
      responses:
        "200":
          description: Readiness summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessSummary"
  /passport:
    get:
      operationId: getCapabilityPassport
      tags: [learner]
      summary: Get the longitudinal capability passport
      responses:
        "200":
          description: Capability passport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityPassport"
  /trainer/dashboard:
    get:
      operationId: getTrainerDashboard
      tags: [trainer]
      summary: Get trainer workspace summary
      responses:
        "200":
          description: Trainer dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainerDashboard"
  /trainer/review-queue:
    get:
      operationId: getTrainerReviewQueue
      tags: [trainer]
      summary: List practice and evidence reviews
      responses:
        "200":
          description: Trainer review queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewQueueItem"
  /trainer/evidence/{evidenceId}/review:
    post:
      operationId: reviewEvidenceByTrainer
      tags: [trainer]
      summary: Record a trainer evidence review
      parameters:
        - $ref: "#/components/parameters/EvidenceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainerEvidenceReviewInput"
      responses:
        "200":
          description: Updated evidence record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /trainer/practice/{attemptId}/review:
    post:
      operationId: reviewPracticeAttempt
      tags: [trainer]
      summary: Record trainer feedback on a practice attempt
      parameters:
        - $ref: "#/components/parameters/PracticeAttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainerPracticeReviewInput"
      responses:
        "200":
          description: Updated practice attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeAttempt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /assessor/dashboard:
    get:
      operationId: getAssessorDashboard
      tags: [assessor]
      summary: Get assessor workspace summary
      responses:
        "200":
          description: Assessor dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessorDashboard"
  /assessor/queue:
    get:
      operationId: getAssessorQueue
      tags: [assessor]
      summary: List assessments awaiting assessor action
      responses:
        "200":
          description: Assessor queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewQueueItem"
  /assessor/assessments/{assessmentId}/decision:
    post:
      operationId: submitAssessmentDecision
      tags: [assessor]
      summary: Record an assessor rubric decision
      parameters:
        - $ref: "#/components/parameters/AssessmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessorAssessmentDecisionInput"
      responses:
        "201":
          description: Assessment decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /learning/courses:
    get:
      operationId: listLearningCourses
      tags: [learning]
      summary: List the formal LMS hierarchy for the active learner pathway
      responses:
        "200":
          description: Pathway-scoped course hierarchy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningCourse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /learning/resources:
    post:
      operationId: createLearningResource
      tags: [learning]
      summary: Create a learning resource
      description: Creates learning material; external resource addresses must be absolute HTTP(S) URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningResourceInput"
      responses:
        "201":
          description: Learning resource created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningResource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /learning/transitions:
    post:
      operationId: transitionLearningState
      tags: [learning]
      summary: Apply one authorized, prerequisite-aware learning state transition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningTransitionInput"
      responses:
        "201":
          description: Append-only transition event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningTransitionResult"
        "200":
          description: Existing result returned for an idempotent duplicate request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningTransitionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Transition rejected because state or prerequisites do not match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningTransitionRejection"
  /trainer/authoring/commands:
    post:
      operationId: applyCourseAuthoringCommand
      tags: [trainer]
      summary: Create, edit, reorder, duplicate, or archive one course authoring entity
      description: Trainer-only draft authoring command. It never rewrites learner progress events.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseAuthoringCommand" }
      responses:
        "200":
          description: Authoring entity updated
          content: { application/json: { schema: { $ref: "#/components/schemas/CourseAuthoringCommandResult" } } }
        "201":
          description: Authoring entity created or duplicated
          content: { application/json: { schema: { $ref: "#/components/schemas/CourseAuthoringCommandResult" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /trainer/authoring/courses:
    get:
      operationId: listAuthoredCourses
      tags: [trainer]
      summary: List all trainer-authorable courses including drafts and archived courses
      responses:
        "200": { description: Authoring courses, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LearningCourse" } } } } }
  /storage/uploads/request-url:
    post:
      operationId: requestManagedResourceUploadUrl
      tags: [storage]
      summary: Request a presigned URL for a trainer-managed learning resource
      description: The request carries metadata only. File bytes are uploaded directly to App Storage and stored as an objectPath.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManagedResourceUploadRequest" } } }
      responses:
        "200": { description: Presigned URL issued, content: { application/json: { schema: { $ref: "#/components/schemas/ManagedResourceUploadResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { description: Storage signing failed, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /storage/objects/{objectPath}:
    get:
      operationId: getManagedResourceObject
      tags: [storage]
      summary: Serve a protected managed learning resource
      parameters: [{ name: objectPath, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Protected object stream, content: { "*/*": { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /trainer/authoring/courses/{courseId}/preview:
    get:
      operationId: previewAuthoredCourse
      tags: [trainer]
      summary: Preview the current draft course hierarchy
      parameters: [{ $ref: "#/components/parameters/CourseId" }]
      responses:
        "200": { description: Draft preview, content: { application/json: { schema: { $ref: "#/components/schemas/CourseAuthoringPreview" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /trainer/authoring/courses/{courseId}/validation:
    get:
      operationId: validateAuthoredCourse
      tags: [trainer]
      summary: Validate course outcomes, required activities, practice and readiness mapping
      parameters: [{ $ref: "#/components/parameters/CourseId" }]
      responses:
        "200": { description: Validation report, content: { application/json: { schema: { $ref: "#/components/schemas/CourseValidationReport" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /trainer/authoring/courses/{courseId}/publish:
    post:
      operationId: publishAuthoredCourse
      tags: [trainer]
      summary: Publish a validated immutable course version
      parameters: [{ $ref: "#/components/parameters/CourseId" }]
      responses:
        "201": { description: Immutable version published, content: { application/json: { schema: { $ref: "#/components/schemas/CourseVersion" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /trainer/authoring/courses/{courseId}/versions:
    get:
      operationId: listAuthoredCourseVersions
      tags: [trainer]
      parameters: [{ $ref: "#/components/parameters/CourseId" }]
      responses:
        "200": { description: Immutable publish history, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CourseVersion" } } } } }
  /trainer/authoring/courses/{courseId}/audit:
    get:
      operationId: listCourseAuthoringAudit
      tags: [trainer]
      parameters: [{ $ref: "#/components/parameters/CourseId" }]
      responses:
        "200": { description: Append-only authoring history, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CourseAuthoringAuditEvent" } } } } }
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      responses:
        "200": { description: Users, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminUser" } } } } }
    post:
      operationId: createAdminUser
      tags: [admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/summary:
    get:
      operationId: getAdminOperationalSummary
      tags: [admin]
      responses:
        "200":
          description: Operational counts, queues, bottleneck, and recommended actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOperationalSummary"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/users/{personId}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/PersonId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserUpdate" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/users/{personId}/roles:
    put:
      operationId: replaceAdminUserRoles
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/PersonId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RoleAssignmentInput" } } } }
      responses:
        "200": { description: Updated roles, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/programs:
    get:
      operationId: listAdminPrograms
      tags: [admin]
      responses:
        "200": { description: Programs, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminProgram" } } } } }
    post:
      operationId: createAdminProgram
      tags: [admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminProgramInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AdminProgram" } } } }, "409": { $ref: "#/components/responses/Conflict" } }
  /admin/programs/{programId}:
    patch:
      operationId: updateAdminProgram
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/ProgramId" }]
