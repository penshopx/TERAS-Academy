            - type: "null"
        evidenceCounts:
          $ref: "#/components/schemas/EvidenceCounts"
        nextAction:
          $ref: "#/components/schemas/NextAction"
      required: [learner, program, pathway, capabilityProgress, readiness, currentLearning, currentPractice, mainGap, evidenceCounts, nextAction]
