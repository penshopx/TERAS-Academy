        capability: { type: string }
        evidence: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        status: { type: string }
      required: [id, code, name, capability, evidence, progress, status]
    LearnerDashboard:
      type: object
      properties:
